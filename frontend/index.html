<!DOCTYPE html>
<html>
<head>
    <title>Book Tracker</title>

    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel (to use JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<h1></h1>

<div id="root"></div>

<script type="text/babel">

    function App() {

        const [darkMode, setDarkMode] = React.useState(
            localStorage.getItem("theme") === "dark"
        );

        React.useEffect(() => {
            if (darkMode) {
                document.body.classList.add("dark");
                localStorage.setItem("theme", "dark");
            } else {
                document.body.classList.remove("dark");
                localStorage.setItem("theme", "light");
            }
        }, [darkMode]);

        const [query, setQuery] = React.useState("");
        const [results, setResults] = React.useState([]);

        const searchBooks = async () => {
            const res = await fetch(`https://openlibrary.org/search.json?q=${query}`);
            const data = await res.json();
            setResults(data.docs.slice(0, 10));
        };

        const addBook = async (book) => {
            await fetch("http://localhost:8080/books", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: book.title,
                    author: book.author_name ? book.author_name[0] : "Unknown",
                    totalPages: book.number_of_pages_median || 200,
                    pagesRead: 0,
                    status: "WANT_TO_READ",
                    coverId: book.cover_i || null
                })
            });

            alert("Book added!");
        };

        return (
    <div>
        <div className="header">
            <div className="title">Book Tracker</div>
            <div className="toggle" onClick={() => setDarkMode(!darkMode)}>
                {darkMode ? "Dark" : "Light"}
            </div>
        </div>

        <div className="search-container">
            <div className="search-box">
                <input
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="Search books..."
                />
                <button onClick={searchBooks}>Search</button>
            </div>
        </div>

        {/* Reading Section */}
        <div className="section">
            <h2>Reading</h2>

            {results.slice(0, 3).map((book, i) => {
                const cover = book.cover_i
                    ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`
                    : "";

                return (
                    <div className="book-card" key={i}>
                        {cover && <img src={cover} />}

                        <div className="book-info">
                            <b>{book.title}</b><br/>
                            <small>{book.author_name?.[0]}</small>

                            <div className="progress-bar">
                                <div className="progress-fill" style={{width: "40%"}}></div>
                            </div>
                        </div>

                        <button onClick={() => addBook(book)}>Add</button>
                    </div>
                );
            })}
        </div>

        <div className="footer">
            <a href="library.html">Go to Library →</a>
        </div>
    </div>
);
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
